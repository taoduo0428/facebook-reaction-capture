# Backend development environment only.
#
#   docker compose up --build backend
#
# The port is published to the host loopback: the API refuses non-loopback
# clients by design.  Android execution (ADB, emulator, visible window) stays
# native — do not try to drive a device from this container.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: facebook-automation-platform-backend:dev
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      FACEBOOK_API_LOAD_LOCAL_CONFIG: "0"
      FACEBOOK_LOG_LEVEL: "INFO"
      FACEBOOK_CAPTURE_MAX_RUNTIME_SECONDS: "21600"
      FACEBOOK_SHUTDOWN_WAIT_SECONDS: "30"
      FACEBOOK_DB_URL: "sqlite+pysqlite:////app/data/facebook_backend.db"
    volumes:
      # Runtime state stays on the host so a container rebuild never loses it.
      - ./data:/app/data
      - ./runs:/app/runs
      - ./api-jobs:/app/api-jobs
      - ./api-batches:/app/api-batches
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

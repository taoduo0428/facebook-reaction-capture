name: Source and local contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest test_facebook_local test_facebook_macos test_facebook_capture_orchestrator test_facebook_capture_api test_facebook_worker_bootstrap
      - run: node --check web/app.js
      - run: node --check web_v2/app.js
      - run: python tools/export_source.py
